<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="記錄家裡貓咪的基本資料、每日喝水吃飯、體重、疫苗、驅蟲、就醫與花費，可雲端同步，讓家人用連結一起編輯。">
<meta name="theme-color" content="#ff9f68">
<title>🐱 貓咪照護日誌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🐱</span>
    <div>
      <h1>貓咪照護日誌</h1>
      <p class="sub" id="dbInfo">本機儲存 · 不會上傳任何資料</p>
    </div>
  </div>
  <div class="topbar-actions">
    <label class="cat-filter">
      <span>檢視</span>
      <select id="catFilter"></select>
    </label>
    <button class="icon-btn" id="themeBtn" type="button" title="切換深色 / 淺色">🌙</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="view" class="view"></main>

<footer class="footer">
  <span id="footerNote">資料僅存在這台裝置的瀏覽器中，請定期到「資料」頁備份。</span>
</footer>

<!-- 表單視窗 -->
<div class="modal hidden" id="modal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">編輯</h2>
      <button class="icon-btn" id="modalClose" type="button" aria-label="關閉">✕</button>
    </div>
    <form id="modalForm" class="modal-body" autocomplete="off"></form>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="modalCancel">取消</button>
      <button type="submit" class="btn primary" form="modalForm">儲存</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
